  if(s.includes('incorrect')||s.includes('replaces the incorrect')) return 'Error Identification: افحص التوافق بين الفاعل والفعل، الزمن، الضمائر، حروف الجر، والتوازي في تركيب الجملة.';
  if(/\bthree days ago\b|\byesterday\b|\blast night\b|\blast week\b/.test(s)) return 'Past Simple: كلمات مثل ago / yesterday / last night تدل غالبًا على الماضي البسيط، فنستخدم V2.';
  if(s.includes('at the moment')||s.includes('right now')||s.includes('these days')) return 'Present Continuous: am/is/are + V-ing لوصف فعل يحدث الآن أو وضع مؤقت/متغير.';
  if(s.includes('since')&&(/have been|has been/.test(s))) return 'Present Perfect Continuous: have/has + been + V-ing، ويأتي مع since لنقطة البداية أو for للمدة.';
  if(s.includes('for over')||s.includes('for three years')) return 'Present Perfect / Continuous: for + مدة زمنية، وsince + نقطة بداية.';
  if(s.includes('by then')||s.includes('by this time next')) return 'Future Perfect/Continuous: by + وقت مستقبلي يدل على إتمام الفعل قبل ذلك الوقت؛ غالبًا will have + V3، أو will be + V-ing إذا كان الفعل مستمرًا عند ذلك الوقت.';
  if(s.includes('by the time')&&s.includes('arrived')) return 'Past Perfect: الحدث الذي وقع أولًا في الماضي يأخذ had + V3، خاصة مع by the time.';
  if(s.includes('had wanted')||s.includes('would have')||/if .* had /.test(s)) return 'Third Conditional: If + had + V3, would have + V3.';
  if(/if .* would /.test(s)||s.includes('if i were')||s.includes('if she had more talent')) return 'Second Conditional: If + Past Simple, would + V1 للحالات الافتراضية أو غير الحقيقية.';
  if(/if .* will /.test(s)||s.includes('if you want')||s.includes('if we don')) return 'First Conditional: If + Present Simple, will/can/may + V1 لنتيجة محتملة في المستقبل.';
  if(s.includes('always')||s.includes('usually')||s.includes('normally')||s.includes('typically')||s.includes('every night')||s.includes('on the weekends')) return 'Present Simple: يُستخدم للعادات والحقائق المتكررة، ومع he/she/it نضيف s/es للفعل.';
  if(s.includes('should')) return 'Modal Verb: بعد should يأتي الفعل بصيغته الأساسية V1 بدون to.';
  if(s.includes('might')) return 'Modal Verb: بعد might يأتي الفعل بصيغته الأساسية V1 بدون s أو ed أو ing.';
  if(s.includes('must')) return 'Modal Verb: بعد must يأتي V1 مباشرة بدون to.';
  if(s.includes('does ')||s.startsWith('does ')) return 'Present Simple Question: Does + subject + V1.';
  if(s.includes('do you')) return 'Present Simple Question: Do + subject + V1.';
  if(s.includes('used to')) return 'Used to + V1: للتعبير عن عادة أو حالة كانت في الماضي ولم تعد موجودة الآن.';
  if(s.includes('enjoy')) return 'Gerund: بعد enjoy يأتي V-ing، مثل enjoy reading.';
  if(s.includes('finish')) return 'Gerund: بعد finish يأتي V-ing، مثل finish reading.';
  if(s.includes('keep')) return 'Gerund: بعد keep يأتي V-ing، مثل keep running.';
  if(s.includes('before ')) return 'Preposition/Linker + Gerund: عند اختصار الجملة بعد before يمكن استخدام before + V-ing.';
  if(s.includes('after ')&&Object.values(q.options).some(x=>/ing\b/i.test(x))) return 'Preposition/Linker + Gerund: بعد after يمكن استخدام V-ing عند اختصار الجملة، مثل after graduating.';
  if(s.includes('want')&&Object.values(q.options).some(x=>/^to /i.test(x))) return 'Infinitive: بعد want يأتي to + V1.';
  if(s.includes('who')||s.includes('whom')||s.includes('whose')||s.includes('which')) return 'Relative Clauses: who للأشخاص كفاعل، whom للأشخاص كمفعول به، whose للملكية، which للأشياء.';
  if(s.includes('myself')||s.includes('yourself')||s.includes('himself')||s.includes('themselves')||s.includes('yourselves')) return 'Reflexive Pronouns: myself / yourself / himself / herself / ourselves / yourselves / themselves حسب الفاعل.';
  if(s.includes('mine')||s.includes('yours')||s.includes('his')) return 'Possessive Pronouns: mine/yours/his… تأتي دون اسم بعدها، بينما my/your/his + noun.';
  if(s.includes('some')||s.includes('any')||s.includes('many')||s.includes('much')||s.includes('a few')||s.includes('a little')) return 'Quantifiers: many/a few مع المعدود الجمع، much/a little مع غير المعدود، some غالبًا في الإثبات والعروض، وany غالبًا في النفي والأسئلة.';
  if(s.includes('than')||s.includes('the biggest')||s.includes('the best')||s.includes('the worst')) return 'Comparatives/Superlatives: comparative + than للمقارنة بين اثنين، وthe + superlative للمقارنة مع مجموعة.';
  if(s.includes('too ')||Object.values(q.options).some(x=>x.toLowerCase()==='too')) return 'Too + adjective + to + V1: تعني أكثر من اللازم لدرجة تمنع حدوث الفعل.';
  if(s.includes('while')) return 'While: غالبًا تربط حدثين متزامنين، وقد تأتي مع Past Continuous إذا كان الحدث مستمرًا في الماضي.';
  if(s.includes('when')) return 'When: تربط حدثين أو تشير لوقت حدوث الفعل؛ اختر الزمن وفق سياق الجملة.';
  if(s.includes('because')) return 'Linking Words: because لذكر السبب، while/although للتعارض أو التزامن، however للتباين بين جملتين.';
  if(s.includes('however')||s.includes('although')||s.includes('in addition')||s.includes('therefore')) return 'Transition Words: اختر أداة الربط حسب العلاقة: إضافة، تعارض، سبب/نتيجة، أو تسلسل.';
  if(s.includes('was eaten')||s.includes('was kicked')||s.includes('were caused')||s.includes('is made')||s.includes('have been built')||s.includes('by ')) return 'Passive Voice: be + V3، ونختار زمن be حسب زمن الجملة؛ وقد يأتي الفاعل بعد by.';
  if(s.includes('at 9')||s.includes('june 22')||s.includes('september')||s.includes('new york university')) return 'Prepositions of Time/Place: at للوقت المحدد، on للتاريخ/اليوم، in للشهور والمدن، وat للمؤسسات أو النقاط المحددة.';
  return 'حدّد نوع السؤال أولًا، ثم راقب الكلمات الدالة والزمن وتركيب الفعل وحرف الجر أو الضمير المناسب قبل اختيار الإجابة.';
}
function render(){if(!pool.length)return;if(index>=pool.length){finish();return} const q=pool[index];$('counter').textContent=`السؤال ${index+1} من ${pool.length}`;$('sourceMeta').textContent=`النموذج ${q.model} • رقم ${q.num} • صفحة ${q.page}`;$('bar').style.width=((index)/pool.length*100)+'%';$('question').textContent=q.prompt;$('ruleText').textContent=getRule(q);const box=$('options');box.innerHTML='';const saved=answers[index];Object.entries(q.options).forEach(([k,v])=>{const b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML=`<b>${k})</b> ${escapeHtml(v)}`;if(saved){b.disabled=true;if(k===q.answer)b.classList.add('correct');if(k===saved.choice&&saved.choice!==q.answer)b.classList.add('wrong')}else b.addEventListener('click',()=>choose(k));box.appendChild(b)});const fb=$('feedback');fb.className='feedback';fb.textContent='';if(saved)showFeedback(saved.choice===q.answer,q.answer);$('prevBtn').disabled=index===0;$('nextBtn').textContent=index===pool.length-1?'إنهاء':'التالي'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function choose(k){if(answers[index])return;const q=pool[index];const ok=k===q.answer;answers[index]={choice:k};if(ok){correct++;score++}else wrong++;$('score').textContent=score;$('correct').textContent=correct;$('wrong').textContent=wrong;render()}
function showFeedback(ok,ans){const f=$('feedback');f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✅ إجابة صحيحة':'❌ إجابة غير صحيحة — الإجابة الصحيحة: '+ans}
function finish(){$('quizCard').style.display='none';$('result').style.display='block';const attempted=correct+wrong;const pct=attempted?Math.round(correct/attempted*100):0;$('finalScore').textContent=pct+'%';$('finalText').textContent=`أجبت عن ${attempted} سؤالًا: ${correct} صحيحة و ${wrong} خاطئة.`}
$('nextBtn').addEventListener('click',()=>{if(index<pool.length-1){index++;render()}else finish()});$('prevBtn').addEventListener('click',()=>{if(index>0){index--;render()}});$('restartBtn').addEventListener('click',reset);$('againBtn').addEventListener('click',reset);$('modelSelect').addEventListener('change',reset);$('orderSelect').addEventListener('change',reset);
initModels();reset();
</script>
